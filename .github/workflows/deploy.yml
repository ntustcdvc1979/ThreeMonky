name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 純靜態，沒有建置步驟，整個 repo 直接上傳
      # 註：這裡不加 enablement: true。它需要 token 有 repo administration
      # 權限，預設的 GITHUB_TOKEN 沒有，只會換來一個更難懂的錯誤訊息。
      # Pages 請在 Settings → Pages → Source 選 GitHub Actions，一次就好。
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
